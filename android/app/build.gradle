plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.gms.google-services" 
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.skillswap.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true // Enable desugaring
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.skillswap.app"
        manifestPlaceholders = [
            appAuthRedirectScheme: "com.googleusercontent.apps.876834940207-0aovtrp2ufcn0fketfpepgcmdassq9jb"
        ]


        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

dependencies {
    // Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:34.7.0')

    // Firebase Analytics (required base)
    implementation 'com.google.firebase:firebase-analytics'

    // Desugaring (you already have this)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}


flutter {
    source = "../.."
}
